<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOONMELON ACRES — plant, mutate, harvest: 7 seasons, 6 crop lines, 9 beds, 8 talismans, 2 storm bosses, the Locust Moon</title>
<style>
  html, body { margin: 0; padding: 0; background: #060a18; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #stage { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 1280px; height: 720px; background: #0a1230; cursor: pointer; }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; height: 46px;
    display: flex; align-items: center; gap: 20px; padding: 0 18px;
    color: #eaffd8; font-size: 17px; letter-spacing: .04em;
    background: linear-gradient(180deg, rgba(4,8,24,.88), rgba(4,8,24,.55) 70%, rgba(4,8,24,0));
    pointer-events: none; text-shadow: 0 1px 3px #000;
  }
  #hud .lab { color: #9fd8b4; font-size: 12px; text-transform: uppercase; letter-spacing: .18em; margin-right: 6px; }
  #hud .val { font-weight: bold; }
  .barwrap { flex: 0 0 130px; height: 10px; border: 1px solid #4a7a9f; border-radius: 5px; background: rgba(10,20,44,.8); overflow: hidden; }
  .barwrap span { display: block; height: 100%; width: 0%; transition: width .2s; }
  #waterbar { background: linear-gradient(90deg, #2a9fd8, #7fe8ff); }
  #blightbar { background: linear-gradient(90deg, #7a4fd0, #e03a6e); }
  #msg {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
    color: #eaffd8; font-size: 16px; pointer-events: none; text-shadow: 0 1px 4px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <span><span class="lab">Season</span><span class="val" id="h-season">–</span></span>
    <span><span class="lab">Coins</span><span class="val" id="h-coins">0</span></span>
    <span><span class="lab">Quota</span><span class="val" id="h-quota">0/0</span></span>
    <span><span class="lab">Score</span><span class="val" id="h-score">0</span></span>
    <span><span class="lab">Water</span></span><span class="barwrap"><span id="waterbar"></span></span>
    <span><span class="lab">Blight</span></span><span class="barwrap"><span id="blightbar"></span></span>
  </div>
  <div id="msg"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
